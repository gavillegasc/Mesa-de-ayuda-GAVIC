<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Help Desk - Mockup</title>
    <style>
        /* Design system: variables CSS de color, tipografía y espaciado */
        :root {
            /* Paleta base inspirada en skin.html: verde premium, blanco, mint y tinta suave */
            --white-rgb: 255, 255, 255;
            --ink-rgb: 38, 52, 61;
            --line-rgb: 36, 56, 48;
            --primary-rgb: 23, 164, 81;
            --primary-light-rgb: 53, 199, 114;
            --primary-deep-rgb: 25, 58, 40;
            --primary-shadow-rgb: 26, 93, 48;
            --surface-soft-rgb: 243, 248, 241;
            --coral-rgb: 248, 146, 138;
            --mint-rgb: 97, 225, 151;
            --gold-rgb: 245, 214, 92;
            --accent-rgb: 246, 217, 112;
            --primary-color: #17a451;
            --primary-dark: #0c6d37;
            --primary-deep: #07562b;
            --primary-light: #35c772;
            --primary-soft: #e8fff2;
            --primary-pale: #f1fbf4;
            --secondary-color: #83909a;
            --accent-color: #f6d970;
            --danger-soft: #fff1ee;
            --bg-color: #f8fbf7;
            --card-bg: rgba(var(--white-rgb), 0.82);
            --card-bg-solid: #ffffff;
            --card-bg-soft: #f3f8f1;
            --text-main: #26343d;
            --text-soft: #6f7d86;
            --text-inverse: #ffffff;
            --border-color: rgba(var(--line-rgb), 0.10);
            --border-light: rgba(var(--white-rgb), 0.88);
            --focus-ring: rgba(var(--primary-rgb), 0.24);
            --green-glow: rgba(var(--primary-light-rgb), 0.30);
            --shadow-lg: 0 30px 70px rgba(var(--ink-rgb), 0.16);
            --shadow-md: 0 18px 38px rgba(var(--ink-rgb), 0.13);
            --shadow-sm: 0 8px 20px rgba(var(--primary-shadow-rgb), 0.10);
            --shadow-button: 0 14px 26px rgba(var(--primary-rgb), 0.26);
            --shadow-inset: inset 6px 6px 14px rgba(var(--primary-deep-rgb), 0.06), inset -6px -6px 18px rgba(var(--white-rgb), 0.86);
            --gradient-primary: linear-gradient(145deg, var(--primary-light), var(--primary-color) 48%, var(--primary-dark));
            --gradient-surface: linear-gradient(145deg, rgba(var(--white-rgb), 0.94), rgba(var(--surface-soft-rgb), 0.84));
            --gradient-bg: radial-gradient(circle at 84% 8%, rgba(var(--coral-rgb), 0.22) 0, transparent 18rem), radial-gradient(circle at 11% 55%, rgba(var(--mint-rgb), 0.18) 0, transparent 24rem), radial-gradient(circle at 91% 92%, rgba(var(--gold-rgb), 0.24) 0, transparent 20rem), linear-gradient(180deg, var(--card-bg-solid) 0%, var(--bg-color) 48%, var(--card-bg-solid) 100%);
            --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --spacing-xs: 6px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 26px;
            --radius-xl: 34px;
            --app-width: 440px;
            --header-height: 118px;
            --footer-height: 118px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background: var(--gradient-bg);
            color: var(--text-main);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(14px, 3vw, 30px);
            overflow: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            pointer-events: none;
            border-radius: 999px;
            filter: blur(28px);
            opacity: 0.58;
            z-index: 0;
            animation: ambientFloat 10s ease-in-out infinite alternate;
        }

        body::before {
            width: 28rem;
            height: 28rem;
            left: -15rem;
            top: 10rem;
            background: radial-gradient(circle, var(--green-glow), transparent 66%);
        }

        body::after {
            width: 24rem;
            height: 24rem;
            right: -12rem;
            bottom: -10rem;
            background: radial-gradient(circle, rgba(var(--accent-rgb), 0.24), transparent 66%);
            animation-delay: -3s;
        }

        @keyframes ambientFloat {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to { transform: translate3d(12px, -16px, 0) scale(1.04); }
        }

        @keyframes softRain {
            0% { transform: translate3d(0, -18px, 0); opacity: 0; }
            14% { opacity: 0.46; }
            86% { opacity: 0.18; }
            100% { transform: translate3d(18px, 92vh, 0); opacity: 0; }
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: var(--shadow-button); }
            50% { box-shadow: 0 18px 34px rgba(var(--primary-rgb), 0.34); }
        }

        /* main/encabezado */
        header {
            width: min(100%, var(--app-width));
            min-height: var(--header-height);
            background: var(--card-bg);
            padding: var(--spacing-lg) var(--spacing-lg) var(--spacing-md);
            border: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-color);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
            box-shadow: var(--shadow-lg), inset 1px 1px 3px rgba(var(--white-rgb), 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            inset: -42% -24% auto auto;
            width: 260px;
            height: 160px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(var(--primary-light-rgb), 0.26), transparent 67%);
            pointer-events: none;
        }

        header::after {
            content: "";
            position: absolute;
            inset: 10px auto auto 50%;
            width: 86px;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
            transform: translateX(-50%);
            opacity: 0.72;
            pointer-events: none;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: max-content;
            position: relative;
            z-index: 1;
        }

        .logo-area::before {
            content: "";
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border-radius: 16px;
            background: var(--gradient-primary);
            box-shadow: var(--shadow-sm), inset 1px 1px 1px rgba(var(--white-rgb), 0.48);
            background-image: url("data:image/svg+xml,%3Csvg width='42' height='42' viewBox='0 0 42 42' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 15.5h16a4 4 0 0 1 4 4v3.2a4 4 0 0 1-4 4h-6.2l-5.1 4.2v-4.2H13a4 4 0 0 1-4-4v-3.2a4 4 0 0 1 4-4Z'/%3E%3Cpath d='M15.5 21.1h.1M21 21.1h.1M26.5 21.1h.1'/%3E%3Cpath d='M15 10.5c1.9-1.4 3.9-2 6-2 2.2 0 4.2.7 6 2' opacity='.68'/%3E%3C/g%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 42px 42px;
        }

        .logo-area h1 {
            font-size: clamp(1.04rem, 3vw, 1.28rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
            color: var(--text-main);
            font-weight: 900;
            text-shadow: 0 1px 0 var(--card-bg-solid);
        }

        .logo-area h1::after {
            content: "AI Help Desk";
            display: block;
            margin-top: 5px;
            color: var(--primary-color);
            font-size: 0.64rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 800;
        }

        .api-config {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            position: relative;
            z-index: 1;
        }

        .api-config input {
            width: 182px;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: rgba(var(--white-rgb), 0.62);
            color: var(--text-main);
            box-shadow: var(--shadow-inset);
            outline: none;
            transition: border-color 0.24s ease, box-shadow 0.24s ease, background 0.24s ease, transform 0.24s ease;
        }

        .api-config input::placeholder,
        textarea::placeholder {
            color: var(--secondary-color);
            opacity: 0.78;
        }

        .api-config input:focus,
        textarea:focus {
            border-color: var(--primary-color);
            background: rgba(var(--white-rgb), 0.86);
            box-shadow: 0 0 0 5px var(--focus-ring), var(--shadow-inset);
            transform: translateY(-1px);
        }

        /* main/body */
        main {
            width: min(100%, var(--app-width));
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            background: rgba(var(--white-rgb), 0.54);
            border-left: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            position: relative;
            z-index: 2;
            isolation: isolate;
        }

        main::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background-image: radial-gradient(circle, rgba(var(--primary-rgb), 0.10) 0 2px, transparent 2.5px), radial-gradient(circle, rgba(var(--ink-rgb), 0.055) 0 1px, transparent 1.5px);
            background-size: 78px 78px, 44px 44px;
            background-position: 2px 12px, 24px 30px;
            animation: softRain 10s linear infinite;
            opacity: 0.44;
        }

        main::-webkit-scrollbar {
            width: 8px;
        }

        main::-webkit-scrollbar-track {
            background: transparent;
        }

        main::-webkit-scrollbar-thumb {
            background: rgba(var(--primary-rgb), 0.22);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        .chat-placeholder {
            max-width: 800px;
            margin: auto auto 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chat-placeholder::before {
            content: "Soporte técnico asistido por IA";
            align-self: center;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            margin-bottom: 8px;
            border-radius: 999px;
            background: rgba(var(--white-rgb), 0.70);
            border: 1px solid var(--border-light);
            color: var(--primary-dark);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: 0.72rem;
            font-weight: 850;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .message {
            margin-bottom: 0;
            padding: 15px 16px;
            border-radius: 22px;
            border: 1px solid var(--border-light);
            max-width: 86%;
            box-shadow: var(--shadow-sm);
            animation: messageIn 0.45s ease both;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .message:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: rgba(var(--primary-rgb), 0.18);
        }

        .message strong {
            display: block;
            margin-bottom: 7px;
            font-size: 0.76rem;
            letter-spacing: 0.02em;
            font-weight: 850;
        }

        .message p {
            font-size: 0.94rem;
            line-height: 1.55;
        }

        .message.ai {
            background: var(--gradient-surface);
            align-self: flex-start;
            border-top-left-radius: 10px;
            color: var(--text-main);
        }

        .message.ai::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 4px;
            background: var(--gradient-primary);
            opacity: 0.92;
        }

        .message.ai strong {
            color: var(--primary-dark);
        }

        .message.user {
            background: var(--gradient-primary);
            align-self: flex-end;
            border-style: solid;
            border-color: rgba(var(--white-rgb), 0.28);
            border-top-right-radius: 10px;
            color: var(--text-inverse);
            box-shadow: var(--shadow-button);
            animation-delay: 0.08s;
        }

        .message.user::after {
            content: "";
            position: absolute;
            inset: -44px -32px auto auto;
            width: 130px;
            height: 92px;
            border-radius: 999px;
            background: rgba(var(--white-rgb), 0.13);
            pointer-events: none;
        }

        .message.user strong {
            color: var(--text-inverse);
        }

        /* main/footer */
        footer {
            width: min(100%, var(--app-width));
            min-height: var(--footer-height);
            background: var(--card-bg);
            padding: var(--spacing-md) var(--spacing-lg) var(--spacing-lg);
            border: 1px solid var(--border-light);
            border-top: 1px solid var(--border-color);
            border-radius: 0 0 var(--radius-xl) var(--radius-xl);
            box-shadow: var(--shadow-lg), inset 1px 1px 3px rgba(var(--white-rgb), 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            position: relative;
            z-index: 2;
        }

        footer::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 10px;
            width: 128px;
            height: 5px;
            border-radius: 999px;
            background: rgba(var(--ink-rgb), 0.22);
            transform: translateX(-50%);
            opacity: 0.7;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: var(--spacing-sm);
            padding: 8px;
            border-radius: 24px;
            background: rgba(var(--white-rgb), 0.58);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-inset);
        }

        textarea {
            flex: 1;
            padding: 13px 14px;
            border: 1px solid transparent;
            border-radius: 18px;
            resize: none;
            height: 58px;
            max-height: 120px;
            font-family: inherit;
            color: var(--text-main);
            background: rgba(var(--white-rgb), 0.68);
            outline: none;
            transition: border-color 0.24s ease, box-shadow 0.24s ease, background 0.24s ease, transform 0.24s ease;
        }

        button {
            background: var(--gradient-primary);
            color: var(--text-inverse);
            border: 1px solid rgba(var(--white-rgb), 0.32);
            padding: 0 var(--spacing-lg);
            min-height: 44px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 850;
            letter-spacing: -0.01em;
            box-shadow: var(--shadow-button);
            transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease, opacity 0.22s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 0%, rgba(var(--white-rgb), 0.30) 45%, transparent 72%);
            transform: translateX(-130%);
            transition: transform 0.55s ease;
        }

        button:hover {
            opacity: 0.98;
            transform: translateY(-2px);
            filter: saturate(1.06);
            box-shadow: 0 18px 34px rgba(var(--primary-rgb), 0.34);
        }

        button:hover::before {
            transform: translateX(130%);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        #sendBtn {
            min-width: 92px;
            animation: pulseGlow 3.8s ease-in-out infinite;
        }

        @media (max-width: 760px) {
            body {
                padding: 0;
                background: linear-gradient(180deg, var(--card-bg-solid), var(--bg-color));
            }

            header,
            main,
            footer {
                width: 100%;
                max-width: none;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }

            header {
                min-height: auto;
                padding: 18px 16px 14px;
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }

            .logo-area {
                justify-content: flex-start;
            }

            .api-config {
                width: 100%;
            }

            .api-config input {
                flex: 1;
                width: auto;
            }

            main {
                padding: 18px 16px;
            }

            footer {
                min-height: auto;
                padding: 12px 12px 24px;
            }

            .message {
                max-width: 92%;
            }
        }

        @media (max-width: 420px) {
            .api-config,
            .input-container {
                gap: 7px;
            }

            button {
                padding: 0 16px;
            }

            .input-container {
                padding: 7px;
            }

            textarea {
                height: 54px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- main/encabezado: nombre de la app + input para API Key + botón Conectar -->
    <header>
        <div class="logo-area">
            <h1>Mesa de Ayuda IA</h1>
        </div>
        <div class="api-config">
            <input type="password" id="apiKeyInput" placeholder="Ingrese su API Key de OpenAI/Gemini...">
            <button onclick="saveApiKey()">Conectar</button>
        </div>
    </header>

    <!-- main/body: ventana de conversación donde aparecerán los mensajes -->
    <main id="chatWindow">
        <div class="chat-placeholder">
            <div class="message ai">
                <strong>Asistente Virtual (Mockup):</strong>
                <p>Hola. Soy tu asistente técnico basado en IA. ¿En qué puedo ayudarte con los sistemas electromecánicos hoy?</p>
            </div>
            <div class="message user">
                <strong>Usuario (Ejemplo):</strong>
                <p>Necesito consultar el manual de mantenimiento de la caldera pirotubular.</p>
            </div>
            <!-- Los nuevos mensajes se inyectarán aquí -->
        </div>
    </main>

    <!-- main/footer: textarea para escribir la consulta + botón Enviar -->
    <footer>
        <div class="input-container">
            <textarea id="userInput" placeholder="Escribe tu consulta técnica aquí..."></textarea>
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
    </footer>

    <script>
        /* Módulo 1 → Estado: variables globales (apiKey, conversationHistory) */
        // Aquí se almacenará la llave de sesión y el array de objetos con el historial de mensajes.
        let apiKey = '';
        let conversationHistory = [];

        /* Módulo 2 → RAG: base de conocimiento (vacío por ahora) */
        // Espacio reservado para la carga de documentos técnicos (PDF/TXT) procesados para contexto.
        const knowledgeBase = [];

        /* Módulo 3 → System Prompt: reglas del asistente (vacío por ahora) */
        // Definición del comportamiento: "Eres un experto en mantenimiento industrial y riesgo operativo..."
        const SYSTEM_PROMPT = '';

        /* Módulo 4 → API Key: función saveApiKey() (vacío por ahora) */
        function saveApiKey() {
            // Lógica para capturar el valor del input y validarlo o guardarlo en localStorage.
            const apiKeyInput = document.getElementById('apiKeyInput');
            const connectButton = document.querySelector('.api-config button');
            const value = apiKeyInput.value.trim();

            if (!value.startsWith('sk-')) {
                alert('La API Key no parece válida. Debe empezar con "sk-".');
                apiKeyInput.focus();
                return;
            }

            apiKey = value;
            apiKeyInput.disabled = true;
            connectButton.textContent = '✓ Conectado';
            connectButton.disabled = true;
        }

        /* Módulo 5 → Enviar mensaje: función sendMessage() (vacío por ahora) */
        async function sendMessage() {
            // Lógica para capturar el texto del textarea, añadirlo al historial y disparar la llamada al LLM.
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendBtn');
            const text = userInput.value.trim();

            if (!apiKey) {
                alert('Primero ingrese y conecte una API Key válida de OpenAI.');
                document.getElementById('apiKeyInput').focus();
                return;
            }

            if (!text) {
                userInput.focus();
                return;
            }

            conversationHistory.push({ role: 'user', content: text });
            addMessage('user', text);

            userInput.value = '';
            autoResize(userInput);
            showTyping(true);
            sendButton.disabled = true;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        temperature: 0.3,
                        max_tokens: 600,
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            ...conversationHistory
                        ]
                    })
                });

                if (!response.ok) {
                    let errorMessage = `Error HTTP ${response.status}`;

                    try {
                        const errorData = await response.json();
                        errorMessage = errorData?.error?.message || errorMessage;
                    } catch (parseError) {
                        // Si la respuesta de error no es JSON, se conserva el mensaje HTTP.
                    }

                    throw new Error(errorMessage);
                }

                const data = await response.json();
                const assistantText = data?.choices?.[0]?.message?.content?.trim() || 'No se recibió una respuesta válida del modelo.';

                conversationHistory.push({ role: 'assistant', content: assistantText });
                addMessage('assistant', assistantText);
            } catch (error) {
                console.error('Error al llamar a la API de OpenAI:', error);
                addMessage('assistant', `No fue posible obtener respuesta de la IA. Detalle: ${error.message}`);
            } finally {
                showTyping(false);
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        /* Módulo 6 → UI helpers: funciones de interfaz (vacío por ahora) */
        // Funciones para limpiar el input, hacer scroll automático al final del chat y renderizar burbujas.
        function addMessage(role, text) {
            const chatPlaceholder = document.querySelector('.chat-placeholder');
            const message = document.createElement('div');
            const cssRole = role === 'user' ? 'user' : 'ai';
            const label = role === 'user' ? 'Usuario:' : 'Asistente IA:';
            const safeText = escapeHtml(text).replace(/\n/g, '<br>');

            message.className = `message ${cssRole}`;
            message.innerHTML = `<strong>${label}</strong><p>${safeText}</p>`;
            chatPlaceholder.appendChild(message);
            renderMessages();
        }

        function showTyping(visible) {
            const chatPlaceholder = document.querySelector('.chat-placeholder');
            const existingIndicator = document.getElementById('typingIndicator');

            if (!visible) {
                if (existingIndicator) existingIndicator.remove();
                return;
            }

            if (existingIndicator) return;

            const indicator = document.createElement('div');
            indicator.id = 'typingIndicator';
            indicator.className = 'message ai';
            indicator.innerHTML = '<strong>Asistente IA:</strong><p>Escribiendo...</p>';
            chatPlaceholder.appendChild(indicator);
            renderMessages();
        }

        function autoResize(el) {
            const maxHeight = 120;
            el.style.height = 'auto';
            el.style.height = `${Math.min(el.scrollHeight, maxHeight)}px`;
            el.style.overflowY = el.scrollHeight > maxHeight ? 'auto' : 'hidden';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderMessages() {
            // Implementación futura del renderizado dinámico.
            const chatWindow = document.getElementById('chatWindow');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('userInput');
            const apiKeyInput = document.getElementById('apiKeyInput');

            userInput.addEventListener('input', () => autoResize(userInput));
            userInput.addEventListener('keydown', handleKey);

            apiKeyInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveApiKey();
                }
            });
        });
    </script>
</body>
</html>
